<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Heart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9e9ed;
    font-family: "Segoe UI", sans-serif;
}

.container{
    width:360px;
    height:700px;
    background:#f3f3f6;
    border-radius:40px;
    text-align:center;
    padding-top:60px;
    position:relative;
    overflow:hidden;
}

.title{
    font-size:28px;
    color:#b9984b;
    letter-spacing:2px;
    margin-bottom:40px;
}

.heart-wrapper{
    position:relative;
    width:250px;
    height:220px;
    margin:0 auto;
}

canvas{
    position:absolute;
    left:0;
    top:0;
    cursor:crosshair;
}

.hidden-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:22px;
    letter-spacing:3px;
    color:#333;
}

.names{
    position:absolute;
    bottom:100px;
    width:100%;
    font-size:18px;
    color:#666;
    letter-spacing:2px;
}
</style>
</head>
<body>

<div class="container">

    <div class="title">
        ՀԱՐՍԱՆՅԱՑ ՀՐԱՎԵՐ
    </div>

    <div class="heart-wrapper">
        <div class="hidden-text">
            19.12.26 <br>
            <strong>SAVE<br>THE DATE</strong>
        </div>

        <canvas id="scratchCanvas" width="250" height="220"></canvas>
    </div>

    <div class="names">
        ԱՐՄԱՆ & ՄԱՐԻԱՄ
    </div>

</div>

<script>
const canvas = document.getElementById("scratchCanvas");
const ctx = canvas.getContext("2d");

let isDrawing = false;

/* Draw golden heart */
function drawHeart(){
    ctx.fillStyle = "gold";

    ctx.beginPath();
    ctx.moveTo(125,200);
    ctx.bezierCurveTo(20,120,40,40,125,80);
    ctx.bezierCurveTo(210,40,230,120,125,200);
    ctx.fill();
}

drawHeart();

/* Scratch effect */
canvas.addEventListener("mousedown", ()=> isDrawing = true);
canvas.addEventListener("mouseup", ()=> isDrawing = false);
canvas.addEventListener("mouseleave", ()=> isDrawing = false);

canvas.addEventListener("mousemove", function(e){
    if(!isDrawing) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fill();
});
</script>

</body>
</html>
