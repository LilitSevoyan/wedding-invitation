<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="section1 wedding-hero">
        <div class="section1_content">
            <div class="couple_names">
                Արթուր & Լիլիթ
            </div>
            <div class="heart-line">
                <span></span>
                <img src="./heart.svg" width="20" height="18" class="section1__divider-heart-image" alt="Heart">
                <span></span>
            </div>
            <div class="section1__footer">
                <p class="save-date">
                    Save the date
                </p>
                <div class="section1__date">
                    <div class="section1__month">
                        <p>NOV</p>
                    </div>
                    <p class="section1__day">15</p>
                    <div class="section1__year">
                        <p>2026</p>
                    </div>
                </div>
             </div>
        </div>
    </section>
    <section class="section2">
        <div class="section2__content">
            <h2 class="section2__title">
                Հարգելի՛ հյուրեր
            </h2>
            <p class="section2__text">
                <!-- ամենասպասված ->ամենագեղեցիկ  -->
                Մոտենում է մեր կյանքի ամենասպասված
                ու հիշարժան պահերից մեկը։ 
                Մենք ընտանիք ենք կազմում և մեծ
                սիրով հրավիրում ենք 
                <br>
                Ձեզ կիսելու մերերջանկություը։
                <br>
                Ձեր ներկայությունը մեր կողքին շատ
                կարևոր է։
            </p>
            <div class="section2__calendar">
                <div class="section2__calendar-title">
                    ՆՈՅԵՄԲԵՐ 2026
                </div>
                <div class="section2__days">
                    <span class="w-35">13</span>
                    <span class="w-40">14</span>
                    <span class="active">
                        <svg viewBox="0 0 50 45">
                            <path d="M25 45
                            C22 42, 4 30, 2 17
                            C0 7, 7 1, 15 1
                            C20 1, 23 4, 25 8
                            C27 4, 30 1, 35 1
                            C43 1, 50 7, 48 17
                            C46 30, 28 42, 25 45Z"/>
                        </svg>
                        <b>15</b>
                    </span>
                    <span class="w-40">16</span>
                    <span class="w-35">17</span>
                </div>
            </div>
            <div class="section2__image-wrapper">
                <div class="section2__image-back"></div>
                <img src="./invito_wedding.jpg" alt="" class="section2__image">
            </div>
        </div>
    </section>
<script>
    function setAppHeight() {
        document.documentElement.style.setProperty(
            "--vh",
            `${window.innerHeight * 0.01}px`
        );
    }

    setAppHeight();

    window.addEventListener("orientationchange", () => {
        setTimeout(setAppHeight, 300);
    });
</script>
    
</body>
</html>
